# 复制为 config.yaml 后修改，勿将 config.yaml 提交到 Git

app:
  name: multi-agent-decision
  debug: true

api:
  host: 0.0.0.0
  port: 8000
  secret_key: "请替换为随机字符串"

database:
  path: db/app.db

ai:
  # 本地模型路径或 HuggingFace 模型名（课程版按实际选型填写）
  model_path: ""
  embedding_model: "BAAI/bge-small-zh-v1.5"
  similarity_threshold: 0.4
